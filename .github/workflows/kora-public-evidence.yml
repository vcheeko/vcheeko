name: kora-public-evidence

on:
  pull_request:
    paths:
      - "KORA_GOLDEN_REPRODUCTION_PROTOCOL.md"
      - "public-evidence/kora-golden-v0.1/**"
      - "public-evidence/kora-golden-v0.2/**"
      - ".github/workflows/kora-public-evidence.yml"
  push:
    branches: [main]
    paths:
      - "KORA_GOLDEN_REPRODUCTION_PROTOCOL.md"
      - "public-evidence/kora-golden-v0.1/**"
      - "public-evidence/kora-golden-v0.2/**"
      - ".github/workflows/kora-public-evidence.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.14.0

      - name: Verify toolchain
        run: test "$(node --version)" = "v22.14.0"

      - name: Reproduce public Golden evidence semantics v0.1
        run: node public-evidence/kora-golden-v0.1/verify.mjs

      - name: Reproduce adversarial Golden evidence semantics v0.2
        run: node public-evidence/kora-golden-v0.2/verify.mjs
